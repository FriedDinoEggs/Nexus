info:
  name: 20.registerWeakPassword
  type: http
  seq: 22

http:
  method: POST
  url: 127.0.0.1:8000/api/v1/users/register/
  body:
    type: json
    data: |-
      {
        "email": "test-weak-password@test.com",
        "password": "12345678",
        "password_confirm": "12345678"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.password
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
