info:
  name: 30.createLunchOption
  type: http
  seq: 32

http:
  method: POST
  url: 127.0.0.1:8000/api/v1/events/{{event_id}}/lunch-options/
  auth:
    type: bearer
    token: "{{jwt_access}}"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Bento",
        "price": 120
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const axios = require('axios');

        const response = await axios.post(
          'http://127.0.0.1:8000/api/v1/users/login/',
          {
            email: 'testEventManager@test.com',
            password: 'testEventManager'
          }
        );
        bru.setVar("jwt_access", response.data.access);
    - type: after-response
      code: |-
        const data = res.getBody();

        bru.setVar("lunch_option_id", data.id);
        bru.setVar("jwt_access", null);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isNumber
    - expression: res.body.name
      operator: eq
      value: Bruno Bento

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
