info:
  name: 01.loginAdmin
  type: http
  seq: 1

http:
  method: POST
  url: 127.0.0.1:8000/api/v1/users/login/
  body:
    type: json
    data: |-
      {
        "email": "testAdmin@test.com",
        "password": "testAdmin"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
