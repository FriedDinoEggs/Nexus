services:
  postgres:
    image: postgres:18
    container_name: nexus_pg_db
    restart: always
    environment:
      POSTGRES_DB: ${NEXUS_DB_NAME:?error}
      POSTGRES_USER: ${NEXUS_DB_USER:?error}
      POSTGRES_PASSWORD: ${NEXUS_DB_PWD:?error}
      PGDATA: /var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=128MB
        -c max_connections=32
        -c work_mem=8MB
        -c maintenance_work_mem=32MB
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:8-alpine
    container_name: nexus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --protected-mode yes
        --requirepass ${REDIS_PASSWORD:?error}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --bind 0.0.0.0
        --save 900 1
        --save 300 10
        --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexus_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?error}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PWD:?error}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 30
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: 86400 # 一天
      PGADMIN_CONFIG_MAX_SESSION_IDLE_TIME: 7200 # 一小時登出
    ports:
      - "8888:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: api-image
    container_name: api
    ports:
      - "8000:8000"
    environment:
      - NEXUS_DB_HOST=nexus_pg_db
      - NEXUS_DB_PORT=5432
      - REDIS_LOCATION=redis://nexus_redis:6379/1
      - DEBUG=True
      - ALLOW_HOST=localhost,api
    depends_on:
      - postgres
      - redis

  # ── Monitoring ─────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: nexus_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://nexus_redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?error}
    ports:
      - "9121:9121"
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nexus_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: nexus_pg_db:5432/{NEXUS_DB_NAME:?error}?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?error}

    ports:
      - "9187:9187"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=17d"
      - "--web.enable-lifecycle"
    depends_on:
      - api
      - redis-exporter
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: nexus_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?error}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?error}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_IS_DEFAULT_PROD: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pg_data:
  redis_data:
    name: nexus_redis_data
  pgadmin_data:
  prometheus_data:
    name: nexus_prometheus_data
  grafana_data:
    name: nexus_grafana_data
