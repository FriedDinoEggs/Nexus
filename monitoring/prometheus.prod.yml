global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "django-engine1"
    static_configs:
      - targets: ["django-engine1:8000"]
    metrics_path: /metrics

  - job_name: "django-engine2"
    static_configs:
      - targets: ["django-engine2:8000"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
